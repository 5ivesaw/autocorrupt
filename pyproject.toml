[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autocorrupt"
version = "1.0.0"
description = "32-Slice Deterministic Symbolic GOFAI Background Word-Corruption Engine with Retrospective SentenceTape Rewriting"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "5ivesaw"}
]
dependencies = []

[project.scripts]
autocorrupt = "autocorrupt.daemon.slice_31_cli_and_verifier:run_cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["autocorrupt*"]
